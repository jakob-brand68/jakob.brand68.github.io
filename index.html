<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name | Portfolio</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    header, section {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    header {
      text-align: center;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    .social-links a {
      margin: 0 0.5rem;
      text-decoration: none;
      color: #555;
    }
    .portfolio-item {
      margin-bottom: 1.5rem;
    }
    .portfolio-item h3 {
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Your Name</h1>
    <p>Quick intro about who you are and what you do.</p>
    <div class="social-links">
      <a href="#">LinkedIn</a>
      <a href="#">GitHub</a>
      <a href="#">Email</a>
    </div>
  </header>

  <section>
    <h2>Portfolio</h2>
    <div class="portfolio-item">
      <h3>Project Title 1</h3>
      <p>Short description of your project. What it is, what you used, why it matters.</p>
    </div>
    <div class="portfolio-item">
      <h3>Project Title 2</h3>
      <p>Another short description. Add as many as you want here.</p>
    </div>
  </section>
</body>
</html>
